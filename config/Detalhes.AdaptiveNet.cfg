## AdaptiveNet 0.5.1
## Preset conservador para servidor dedicado privado com ate 30 jogadores.
## Servidor PvP do Deadheim: somente Steam, inicie sem -crossplay.
## Grupos sao detectados por proximidade; nao existe limite fixo de 8 ou 12 jogadores.

[General]

## Chave geral. False preserva todos os limites originais do Valheim.
# Setting type: Boolean
# Default value: true
Enabled = true

## Auto aplica mudancas somente quando nao ha outro overhaul de rede conhecido.
# Setting type: OperatingMode
# Default value: Auto
# Acceptable values: Auto, Active, ObserveOnly
Mode = Auto

[Controller]

# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 5
SampleIntervalSeconds = 1

## Piso da taxa real de envio Steam de cada conexao. A Steam nao estima banda: so prende a
## taxa entre este piso e o teto, entao um teto abaixo do piso derruba a taxa ate o jogador
## reconectar. 150 e a taxa fixa do proprio Valheim; abaixo disso o mod fica pior que o vanilla.
# Setting type: Int32
# Default value: 150
# Acceptable value range: From 16 to 4096
MinimumSendRateKiB = 150

# Setting type: Int32
# Default value: 4096
# Acceptable value range: From 128 to 65536
MaximumSendRateKiB = 4096

# Setting type: Int32
# Default value: 512
# Acceptable value range: From 16 to 65536
InitialSendRateKiB = 512

## Orcamento agregado de upload para 30 jogadores (12 MiB/s = 96 Mbit/s). Grupos recebem peso 1.5.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 0 to 1024
ServerUploadBudgetMiB = 12

# Setting type: Int32
# Default value: 64
# Acceptable value range: From 1 to 4096
AdditiveIncreaseKiB = 64

# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.25 to 0.95
MultiplicativeDecrease = 0.75

# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 30
HealthySamplesBeforeIncrease = 3

[Latency]

# Setting type: Single
# Default value: 60
# Acceptable value range: From 5 to 500
TargetQueueDelayMs = 60

# Setting type: Single
# Default value: 180
# Acceptable value range: From 10 to 2000
CongestedQueueDelayMs = 180

# Setting type: Single
# Default value: 0.88
# Acceptable value range: From 0.1 to 1
MinimumConnectionQuality = 0.88

# Setting type: Int32
# Default value: 45
# Acceptable value range: From 5 to 500
PingInflationThresholdMs = 45

[ZDO]

## 10 KiB e o piso conservador do Valheim.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 10 to 1024
MinimumQueueBudgetKiB = 10

## Teto por atendimento; cresce e recua por conexao conforme a fila real.
## Comeca em 16 para a primeira rodada de medicao com carga real: com 12 peers/frame,
## 48 KiB permitia rajadas de ate ~576 KiB num unico frame do scheduler (57x o vanilla).
## Suba em passos pequenos somente depois de confirmar queue_max_ms/server_queue_delay_ms baixos.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 10 to 4096
MaximumQueueBudgetKiB = 16

[Steam]

# Setting type: Int32
# Default value: 128
# Acceptable value range: From 64 to 65536
MinimumSendBufferKiB = 128

# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 128 to 262144
MaximumSendBufferKiB = 2048

# Setting type: Int32
# Default value: 2500
# Acceptable value range: From 0 to 20000
NagleTimeMicroseconds = 2500

## Somente servidor dedicado Steam: evita AllocHGlobal e Marshal.Copy por pacote.
# Setting type: Boolean
# Default value: true
PinnedSend = true

[Scheduler]

# Setting type: Boolean
# Default value: true
Enabled = true

## Jogadores dentro deste raio sao considerados proximos.
# Setting type: Int32
# Default value: 160
# Acceptable value range: From 20 to 1000
GroupRadiusMeters = 160

## A cadencia rapida comeca em dois proximos e serve grupos de qualquer tamanho.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 2 to 20
GroupMinimumPlayers = 2

## Teto para grupos grandes: duplas ate 4 usam 50 ms, grupos ate 8 usam 75 ms e grupos maiores usam 100 ms.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 25 to 1000
GroupedPeerIntervalMs = 100

## Jogadores espalhados continuam atendidos a 4 Hz.
# Setting type: Int32
# Default value: 250
# Acceptable value range: From 25 to 2000
SoloPeerIntervalMs = 250

# Setting type: Int32
# Default value: 50
# Acceptable value range: From 25 to 1000
ClientToServerIntervalMs = 50

## Teto de tentativas por frame, nao limite de jogadores no grupo.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 1 to 64
MaximumPeersPerFrame = 12

## Tempo maximo de CPU gasto no escalonador a cada frame.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.1 to 20
CpuBudgetMs = 0.75

[Diagnostics]

# Setting type: KeyCode
# Default value: F8
OverlayKey = F8

## Pressione no cliente logo depois de perceber lag. O servidor preserva 60 s antes e 15 s depois.
# Setting type: KeyCode
# Default value: F9
IncidentMarkerKey = F9

# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 300
LogIntervalSeconds = 15

## Ative temporariamente para diagnostico; os CSVs ficam em BepInEx/AdaptiveNet.
# Setting type: Boolean
# Default value: false
CsvTelemetry = false

## Caixa-preta por jogador no servidor. Nao grava conteudo de mensagens.
# Setting type: Boolean
# Default value: true
IncidentTelemetry = true

## Relatorio pequeno cliente -> servidor com FPS, stalls, GC e fila de upload.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 5
ClientReportIntervalSeconds = 1

# Setting type: Int32
# Default value: 60
# Acceptable value range: From 15 to 180
HistorySeconds = 60

# Setting type: Int32
# Default value: 15
# Acceptable value range: From 5 to 60
IncidentPostSeconds = 15

# Setting type: Int32
# Default value: 45
# Acceptable value range: From 15 to 300
IncidentCooldownSeconds = 45

## Uma coleta de GC no mesmo frame e correlacao, nao prova causalidade.
# Setting type: Single
# Default value: 250
# Acceptable value range: From 50 to 2000
FrameStallThresholdMs = 250

# Setting type: Single
# Default value: 500
# Acceptable value range: From 100 to 5000
SevereFrameStallThresholdMs = 500

# Setting type: Single
# Default value: 500
# Acceptable value range: From 100 to 10000
ClientReportDelayThresholdMs = 500

# Setting type: Single
# Default value: 4
# Acceptable value range: From 2 to 30
ClientReportMissingSeconds = 4

## Conta ownership somente de personagens/mobs ativos; nao varre o mundo inteiro.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 30
OwnershipSampleIntervalSeconds = 5

# Setting type: Int32
# Default value: 16
# Acceptable value range: From 1 to 256
IncidentFileMaxMiB = 16

# Setting type: Int32
# Default value: 16
# Acceptable value range: From 2 to 500
RetainedIncidentFiles = 16

# Setting type: Int32
# Default value: 7
# Acceptable value range: From 1 to 90
IncidentRetentionDays = 7
